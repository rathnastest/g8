name: pages-format-probe
on: [workflow_dispatch]
permissions:
  id-token: write
  pages: write
  contents: read
concurrency: pages-format-probe
jobs:
  gzip-zipped:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - run: mkdir -p site && echo '<h1>gzip zipped</h1>' > site/index.html && tar -czf artifact.tar -C site .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: probe-gzip-zipped, path: artifact.tar }
      - uses: actions/deploy-pages@v4
        with: { artifact_name: probe-gzip-zipped }
  tar-zipped:
    needs: gzip-zipped
    if: always()
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - run: mkdir -p site && echo '<h1>tar zipped</h1>' > site/index.html && tar -cf carrier.bin -C site .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: probe-tar-zipped, path: carrier.bin }
      - uses: actions/deploy-pages@v4
        with: { artifact_name: probe-tar-zipped }
